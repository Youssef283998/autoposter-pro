[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autoposter"
dynamic = ["version"]
description = "Self-hosted social media auto-poster and scheduler. Pay once, own it."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [{ name = "AutoPoster Pro" }]
keywords = ["social-media", "scheduler", "autopost", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = [
    "APScheduler>=3.10,<4",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "authlib>=1.3,<2",
    "SQLAlchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "Pillow>=10.3,<12",
    "python-dateutil>=2.9,<3",
    "cryptography>=42,<47",
    "grapheme>=0.6,<1",
    "filetype>=1.2,<2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]
keyring = ["keyring>=25,<26"]
mastodon = ["Mastodon.py>=1.8,<2"]
bluesky = ["atproto>=0.0.55,<1"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<8",
    "respx>=0.21,<1",
    "freezegun>=1.5,<2",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
    "types-python-dateutil>=2.9",
    "types-PyYAML>=6.0",
]

[project.urls]
Documentation = "https://example.invalid/autoposter/docs"
Support = "https://example.invalid/autoposter/support"

[project.scripts]
autoposter = "autoposter.cli.main:main"

[tool.hatch.version]
path = "autoposter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["autoposter"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["autoposter/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # typer defaults in signatures

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["autoposter"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "autoposter.cli.*",
    "autoposter.web.*",
    "autoposter.migrations.*",
    "tests.*",
]
strict = false
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "type-arg",
    "no-any-return",
    "attr-defined",
    "index",
    "call-overload",
    "unused-ignore",
    "unreachable",
    "untyped-decorator",
    "misc",
]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "atproto.*",
    "autoposter.web.*",
    "fastapi",
    "fastapi.*",
    "starlette",
    "starlette.*",
    "filetype.*",
    "grapheme.*",
    "dateutil.*",
    "dateutil.tz.*",
    "keyring.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:autoposter.*"]

[tool.coverage.run]
source = ["autoposter"]
branch = true
omit = ["autoposter/migrations/*", "autoposter/cli/*", "autoposter/web/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
