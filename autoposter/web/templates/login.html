<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AutoPoster Pro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <h1>Login</h1>
        {% if request.query_params.get('error') %}<p class="error">Wrong password.</p>{% endif %}
        <form method="post" action="/login">
            <label for="password">Password</label>
            <input type="password" id="password" name="password_attempt" required>
            <button type="submit">Login</button>
        </form>
    </main>
</body>
</html>
